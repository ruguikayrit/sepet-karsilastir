services:
  - type: web
    name: sepet-price-api
    runtime: docker
    repo: https://github.com/ruguikayrit/sepet-karsilastir
    branch: master
    dockerfilePath: ./Dockerfile.price-api
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PRICE_API_MARKET_WORKERS
        value: "12"
      - key: PRICE_API_ITEM_WORKERS
        value: "8"
      - key: PRICE_API_PAGE_CACHE_TTL
        value: "60"

name: Deploy Staging (GitHub Pages)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-staging
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos lib test

      - name: Test
        run: flutter test

      - name: Build web (staging)
        env:
          PRICE_API_URL: ${{ secrets.PRICE_API_URL }}
        run: |
          ARGS=(--release --base-href "/sepet-karsilastir/")
          ARGS+=(
            --dart-define=USE_MARKET_FIYATI=true
            --dart-define=DEFAULT_REGION=istanbul
          )
          if [ -n "$PRICE_API_URL" ]; then
            ARGS+=(
              --dart-define=USE_LIVE_PRICES=true
              --dart-define=API_BASE_URL="$PRICE_API_URL"
            )
          fi
          flutter build web "${ARGS[@]}"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true

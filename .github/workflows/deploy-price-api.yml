name: Deploy Price API (Render)

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'tools/price_api/**'
      - 'Dockerfile.price-api'
      - 'render.yaml'
      - 'lib/data/price_book.dart'
      - 'lib/data/mock_catalog.dart'
      - 'lib/data/brands.dart'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.RENDER_API_KEY != '' && secrets.RENDER_OWNER_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
        run: python3 tools/price_api/deploy_render.py

  deploy-hook:
    runs-on: ubuntu-latest
    if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

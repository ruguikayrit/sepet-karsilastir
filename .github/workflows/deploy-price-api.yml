name: Deploy Price API (Render)

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'tools/price_api/**'
      - 'Dockerfile.price-api'
      - 'render.yaml'
      - 'lib/data/price_book.dart'
      - 'lib/data/mock_catalog.dart'
      - 'lib/data/brands.dart'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ secrets.RENDER_OWNER_ID }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Deploy hook tetikleniyor..."
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
            exit 0
          fi
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_OWNER_ID" ]; then
            echo "Render secret'ları tanımlı değil; deploy atlandı."
            echo "Dashboard: https://dashboard.render.com/blueprint/new"
            exit 0
          fi
          python3 tools/price_api/deploy_render.py

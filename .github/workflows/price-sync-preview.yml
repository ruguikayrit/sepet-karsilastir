name: Price Sync Preview (temporary)

# Geçici: fiyat defterini CI'dan üretip artifact olarak alır.
#
# Migros'un arama servisi geliştirme makinesinden 403 dönüyor, CI'dan
# açılıyor. Defteri burada üretip indiriyoruz; bu dosya iş bitince silinecek.

on:
  push:
    branches: [cursor/verified-prices-only-7558]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices from market sites
        run: |
          python3 tools/price_sync/sync.py --fresh --jobs 8 --delay 0.2 \
            --allow-shrink

      - name: Summarize book
        run: |
          head -25 lib/data/price_book.dart
          grep -c 'MarketOffer(' lib/data/price_book.dart

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        continue-on-error: true
        run: flutter test

      - name: Upload price book
        uses: actions/upload-artifact@v4
        with:
          name: price-book
          path: lib/data/price_book.dart

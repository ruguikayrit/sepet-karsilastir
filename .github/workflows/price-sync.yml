name: Daily Price Sync

# Fiyatlar her gün marketlerin kendi sayfalarından yeniden okunur.
#
# Uygulamada gösterilen her tutar, satıra dokununca açılan market sayfasından
# gelir; bu iş o sayfaları yeniden çekip `lib/data/price_book.dart` dosyasını
# günceller. Defter küçülürse (bir market yanıt vermemişse) araç yazmayı
# reddeder ve iş burada durur — kullanıcı eski ama doğru fiyatı görmeye devam
# eder.

on:
  schedule:
    # 04:10 UTC = 07:10 TRT — sabah fiyatları
    - cron: "10 4 * * *"
    # 12:10 UTC = 15:10 TRT — öğleden sonra güncelleme
    - cron: "10 12 * * *"
    # 18:10 UTC = 21:10 TRT — akşam fiyatları
    - cron: "10 18 * * *"
  workflow_dispatch:
    inputs:
      markets:
        description: "Virgülle ayrılmış market listesi (boşsa tümü)"
        required: false
        default: ""
      allow_shrink:
        description: "Defter küçülse de yaz"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: price-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices from market sites
        env:
          MARKETS: ${{ inputs.markets }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink }}
        # Paralel iş: canlı API ile birlikte defter ön ısıtma görevi görür.
        run: |
          args=(--fresh --jobs 8 --delay 0.35)
          if [ -n "$MARKETS" ]; then args+=(--markets "$MARKETS"); fi
          if [ "$ALLOW_SHRINK" = "true" ]; then args+=(--allow-shrink); fi
          python3 tools/price_sync/sync.py "${args[@]}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Defter testleri fiyat, gramaj, marka ve ürün linki tutarlılığını
      # denetler: bir eşleşme kaymışsa yeni fiyatlar yayına çıkmaz.
      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Commit price book
        id: commit
        run: |
          if git diff --quiet -- lib/data/price_book.dart; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Fiyatlar dünkü defterle aynı; commit yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/data/price_book.dart
          git commit -m "Refresh market prices for $(date -u +%Y-%m-%d)"
          git push origin HEAD:master
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build web (staging)
        if: steps.commit.outputs.changed == 'true'
        env:
          PRICE_API_URL: ${{ secrets.PRICE_API_URL }}
        run: |
          ARGS=(--release --base-href "/sepet-karsilastir/")
          ARGS+=( --dart-define=USE_MARKET_FIYATI=true )
          if [ -n "$PRICE_API_URL" ]; then
            ARGS+=(
              --dart-define=USE_LIVE_PRICES=true
              --dart-define=API_BASE_URL="$PRICE_API_URL"
            )
          fi
          flutter build web "${ARGS[@]}"

      # Push'u GITHUB_TOKEN yaptığı için deploy workflow'u kendiliğinden
      # tetiklenmez; güncel fiyatları burada yayına alıyoruz.
      - name: Deploy to gh-pages
        if: steps.commit.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true
